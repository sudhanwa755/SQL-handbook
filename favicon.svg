<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c130f" />
      <stop offset="100%" stop-color="#050806" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.35" />
  
  <!-- Subtle glowing background ambient -->
  <circle cx="32" cy="24" r="18" fill="#22c55e" fill-opacity="0.1" filter="url(#glow)" />

  <!-- Database Cylinders in Rich Forest Tone -->
  <!-- Bottom Plate -->
  <ellipse cx="32" cy="45" rx="18" ry="6" fill="#0c2317" stroke="url(#greenGrad)" stroke-width="2.2" />
  
  <!-- Middle Plate -->
  <path d="M14 34 C14 40, 50 40, 50 34 L50 45 C50 51, 14 51, 14 45 Z" fill="#0d281a" stroke="url(#greenGrad)" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="32" cy="34" rx="18" ry="6" fill="#123522" stroke="url(#pineGrad)" stroke-width="2" />

  <!-- Top Cylinder -->
  <path d="M14 23 C14 29, 50 29, 50 23 L50 34 C50 40, 14 40, 14 34 Z" fill="#143e28" stroke="url(#greenGrad)" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="32" cy="23" rx="18" ry="6" fill="#165334" stroke="url(#greenGrad)" stroke-width="2.5" />

  <!-- Inner Top Highlight -->
  <ellipse cx="32" cy="23" rx="13" ry="4" fill="none" stroke="#bbf7d0" stroke-width="1.2" stroke-opacity="0.75" />

  <!-- Relational Sparkle Star -->
  <path d="M46 13 L47.5 17.5 L52 19 L47.5 20.5 L46 25 L44.5 20.5 L40 19 L44.5 17.5 Z" fill="#22c55e" filter="url(#glow)" />
</svg>
