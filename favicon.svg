<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Subtle glowing background orb -->
  <circle cx="32" cy="24" r="18" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Database Cylinders -->
  <!-- Bottom Plate -->
  <ellipse cx="32" cy="45" rx="18" ry="6" fill="#0e2340" stroke="url(#cyanGrad)" stroke-width="2.2" />
  
  <!-- Middle Plate -->
  <path d="M14 34 C14 40, 50 40, 50 34 L50 45 C50 51, 14 51, 14 45 Z" fill="#0f1b34" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="32" cy="34" rx="18" ry="6" fill="#132448" stroke="url(#purpleGrad)" stroke-width="2" />

  <!-- Top Cylinder -->
  <path d="M14 23 C14 29, 50 29, 50 23 L50 34 C50 40, 14 40, 14 34 Z" fill="#152b57" stroke="url(#cyanGrad)" stroke-width="2.2" stroke-linejoin="round" />
  <ellipse cx="32" cy="23" rx="18" ry="6" fill="#1e3a8a" stroke="url(#cyanGrad)" stroke-width="2.5" />

  <!-- Inner Top Highlight -->
  <ellipse cx="32" cy="23" rx="13" ry="4" fill="none" stroke="#e0f2fe" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Glowing Relational Sparkle / Star -->
  <path d="M46 13 L47.5 17.5 L52 19 L47.5 20.5 L46 25 L44.5 20.5 L40 19 L44.5 17.5 Z" fill="#38bdf8" filter="url(#glow)" />
</svg>
