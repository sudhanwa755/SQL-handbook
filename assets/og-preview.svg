<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c" />
      <stop offset="50%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.75)" />
      <stop offset="100%" stop-color="rgba(30, 41, 59, 0.4)" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(2, 6, 23, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="180" r="240" fill="#38bdf8" fill-opacity="0.16" filter="url(#softGlow)" />
  <circle cx="1020" cy="460" r="280" fill="#a855f7" fill-opacity="0.18" filter="url(#softGlow)" />
  <circle cx="680" cy="100" r="180" fill="#10b981" fill-opacity="0.12" filter="url(#softGlow)" />

  <!-- 3D Coordinate Grid Pattern Lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left Side: Brand & Value Proposition -->
  <!-- Top Category Chip -->
  <g transform="translate(80, 80)">
    <rect width="280" height="38" rx="19" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <circle cx="20" cy="19" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
    <text x="36" y="24" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">INTERACTIVE RELATIONAL TEXTBOOK</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="190" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">The Definitive</text>
  <text x="80" y="260" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" letter-spacing="-1.5">SQL Handbook</text>

  <!-- Subtitle -->
  <text x="80" y="320" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400">
    <tspan x="80" dy="0">From mathematical normal forms (1NF–3NF) to complex</tspan>
    <tspan x="80" dy="28">relational analytical queries with concrete live visual result tables.</tspan>
  </text>

  <!-- Badges / Metrics Row -->
  <g transform="translate(80, 400)">
    <!-- Badge 1: Chapters -->
    <rect x="0" y="0" width="130" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="20" y="36" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">8</text>
    <text x="20" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Chapters</text>

    <!-- Badge 2: Topics -->
    <rect x="145" y="0" width="130" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="165" y="36" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">60+</text>
    <text x="165" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Core Topics</text>

    <!-- Badge 3: Quizzes -->
    <rect x="290" y="0" width="145" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="310" y="36" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">160</text>
    <text x="310" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Assessment Qs</text>

    <!-- Badge 4: Zero Deps -->
    <rect x="450" y="0" width="135" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="470" y="36" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800">100%</text>
    <text x="470" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Pure Vanilla</text>
  </g>

  <!-- Footer author line -->
  <text x="80" y="540" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    Open Source on GitHub · github.com/sudhanwa755/SQL-handbook
  </text>

  <!-- Right Side: Mac Terminal Chrome Mockup -->
  <g transform="translate(680, 90)">
    <!-- Container Window -->
    <rect width="460" height="460" rx="18" fill="url(#codeGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
    
    <!-- Titlebar -->
    <rect width="460" height="42" rx="18" fill="rgba(15, 23, 42, 0.95)" />
    <rect y="24" width="460" height="18" fill="rgba(15, 23, 42, 0.95)" />
    <line x1="0" y1="42" x2="460" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#f43f5e" />
    <circle cx="44" cy="21" r="6" fill="#fbbf24" />
    <circle cx="64" cy="21" r="6" fill="#10b981" />
    
    <!-- Title -->
    <text x="230" y="26" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" text-anchor="middle">query-execution.sql</text>

    <!-- Code Content -->
    <g transform="translate(26, 75)" font-family="'JetBrains Mono', Consolas, monospace" font-size="14">
      <text y="0" fill="#64748b">-- 3-Way Relational Join with Aggregation</text>
      
      <text y="28">
        <tspan fill="#38bdf8" font-weight="700">SELECT</tspan>
        <tspan fill="#f8fafc"> d.dept_name,</tspan>
      </text>
      <text y="52">
        <tspan fill="#38bdf8" font-weight="700">       COUNT</tspan>
        <tspan fill="#f8fafc">(e.emp_id) </tspan>
        <tspan fill="#a78bfa">AS</tspan>
        <tspan fill="#34d399"> total_staff,</tspan>
      </text>
      <text y="76">
        <tspan fill="#38bdf8" font-weight="700">       AVG</tspan>
        <tspan fill="#f8fafc">(e.salary) </tspan>
        <tspan fill="#a78bfa">AS</tspan>
        <tspan fill="#34d399"> avg_compensation</tspan>
      </text>
      <text y="102">
        <tspan fill="#38bdf8" font-weight="700">FROM</tspan>
        <tspan fill="#f8fafc"> departments d</tspan>
      </text>
      <text y="128">
        <tspan fill="#38bdf8" font-weight="700">LEFT JOIN</tspan>
        <tspan fill="#f8fafc"> employees e </tspan>
        <tspan fill="#a78bfa">ON</tspan>
        <tspan fill="#f8fafc"> d.dept_id = e.dept_id</tspan>
      </text>
      <text y="154">
        <tspan fill="#38bdf8" font-weight="700">GROUP BY</tspan>
        <tspan fill="#f8fafc"> d.dept_name</tspan>
      </text>
      <text y="180">
        <tspan fill="#38bdf8" font-weight="700">HAVING</tspan>
        <tspan fill="#f8fafc"> </tspan>
        <tspan fill="#38bdf8" font-weight="700">COUNT</tspan>
        <tspan fill="#f8fafc">(e.emp_id) &gt;= 5;</tspan>
      </text>

      <!-- Mini Result Table -->
      <g transform="translate(0, 220)">
        <rect width="408" height="135" rx="10" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
        <rect width="408" height="30" rx="10" fill="rgba(56, 189, 248, 0.15)" />
        <rect y="18" width="408" height="12" fill="rgba(56, 189, 248, 0.15)" />
        
        <text x="16" y="21" fill="#38bdf8" font-size="11" font-weight="700">DEPT_NAME</text>
        <text x="160" y="21" fill="#38bdf8" font-size="11" font-weight="700">TOTAL_STAFF</text>
        <text x="280" y="21" fill="#38bdf8" font-size="11" font-weight="700">AVG_COMP</text>
        
        <text x="16" y="56" fill="#f8fafc" font-size="12">Engineering</text>
        <text x="160" y="56" fill="#34d399" font-size="12" font-weight="700">42</text>
        <text x="280" y="56" fill="#f8fafc" font-size="12">$145,200</text>
        
        <line x1="0" y1="72" x2="408" y2="72" stroke="rgba(255, 255, 255, 0.06)" />
        
        <text x="16" y="96" fill="#f8fafc" font-size="12">Data Platform</text>
        <text x="160" y="96" fill="#34d399" font-size="12" font-weight="700">18</text>
        <text x="280" y="96" fill="#f8fafc" font-size="12">$158,400</text>
      </g>
    </g>
  </g>
</svg>
