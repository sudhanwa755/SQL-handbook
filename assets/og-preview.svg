<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="50%" stop-color="#080d0a" />
      <stop offset="100%" stop-color="#020403" />
    </linearGradient>
    <linearGradient id="headlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e5e5ea" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 24, 20, 0.85)" />
      <stop offset="100%" stop-color="rgba(10, 14, 12, 0.6)" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(12, 16, 14, 0.95)" />
      <stop offset="100%" stop-color="rgba(8, 11, 9, 0.95)" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="70" result="blur" />
    </filter>
  </defs>

  <!-- Apple Pro Deep OLED Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Vignette (No Cheesy Orbs) -->
  <circle cx="280" cy="160" r="280" fill="#22c55e" fill-opacity="0.08" filter="url(#softGlow)" />
  <circle cx="950" cy="380" r="320" fill="#15803d" fill-opacity="0.09" filter="url(#softGlow)" />

  <!-- Understated Precision Hairline Grid Lines -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Left Side: Brand & Value Proposition -->
  <!-- Top Category Chip -->
  <g transform="translate(80, 80)">
    <rect width="300" height="36" rx="18" fill="rgba(34, 197, 94, 0.08)" stroke="rgba(34, 197, 94, 0.28)" stroke-width="1" />
    <circle cx="20" cy="18" r="4.5" fill="#22c55e" />
    <text x="34" y="23" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">THE DEFINITIVE RELATIONAL TEXTBOOK</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="190" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="54" font-weight="800" letter-spacing="-1.5">The Definitive</text>
  <text x="80" y="260" fill="url(#headlineGrad)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="62" font-weight="900" letter-spacing="-2">SQL Handbook</text>

  <!-- Subtitle -->
  <text x="80" y="320" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="19" font-weight="400">
    <tspan x="80" dy="0">From mathematical normal forms (1NF–3NF) to complex</tspan>
    <tspan x="80" dy="28">relational analytical queries with concrete live visual result tables.</tspan>
  </text>

  <!-- Badges / Metrics Row -->
  <g transform="translate(80, 400)">
    <!-- Badge 1: Chapters -->
    <rect x="0" y="0" width="130" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="20" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="800">8</text>
    <text x="20" y="58" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Chapters</text>

    <!-- Badge 2: Topics -->
    <rect x="145" y="0" width="130" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="165" y="36" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="800">60+</text>
    <text x="165" y="58" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Core Topics</text>

    <!-- Badge 3: Quizzes -->
    <rect x="290" y="0" width="145" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="310" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="800">160</text>
    <text x="310" y="58" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Assessment Qs</text>

    <!-- Badge 4: Zero Deps -->
    <rect x="450" y="0" width="135" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="470" y="36" fill="#22c55e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="800">100%</text>
    <text x="470" y="58" fill="#86868b" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600">Pure Vanilla</text>
  </g>

  <!-- Footer author line -->
  <text x="80" y="540" fill="#636366" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="500">
    Open Source on GitHub · github.com/sudhanwa755/SQL-handbook
  </text>

  <!-- Right Side: Mac Terminal Chrome Mockup -->
  <g transform="translate(680, 90)">
    <!-- Container Window -->
    <rect width="460" height="460" rx="18" fill="url(#codeGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    
    <!-- Titlebar -->
    <rect width="460" height="42" rx="18" fill="rgba(18, 22, 20, 0.95)" />
    <rect y="24" width="460" height="18" fill="rgba(18, 22, 20, 0.95)" />
    <line x1="0" y1="42" x2="460" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="6" fill="#ff5f56" />
    <circle cx="44" cy="21" r="6" fill="#ffbd2e" />
    <circle cx="64" cy="21" r="6" fill="#27c93f" />
    
    <!-- Title -->
    <text x="230" y="26" fill="#86868b" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" text-anchor="middle">query-execution.sql</text>

    <!-- Code Content -->
    <g transform="translate(26, 75)" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14">
      <text y="0" fill="#636366">-- 3-Way Relational Join with Aggregation</text>
      
      <text y="28">
        <tspan fill="#4ade80" font-weight="700">SELECT</tspan>
        <tspan fill="#f5f5f7"> d.dept_name,</tspan>
      </text>
      <text y="52">
        <tspan fill="#4ade80" font-weight="700">       COUNT</tspan>
        <tspan fill="#f5f5f7">(e.emp_id) </tspan>
        <tspan fill="#a1a1a6">AS</tspan>
        <tspan fill="#86efac"> total_staff,</tspan>
      </text>
      <text y="76">
        <tspan fill="#4ade80" font-weight="700">       AVG</tspan>
        <tspan fill="#f5f5f7">(e.salary) </tspan>
        <tspan fill="#a1a1a6">AS</tspan>
        <tspan fill="#86efac"> avg_compensation</tspan>
      </text>
      <text y="102">
        <tspan fill="#4ade80" font-weight="700">FROM</tspan>
        <tspan fill="#f5f5f7"> departments d</tspan>
      </text>
      <text y="128">
        <tspan fill="#4ade80" font-weight="700">LEFT JOIN</tspan>
        <tspan fill="#f5f5f7"> employees e </tspan>
        <tspan fill="#a1a1a6">ON</tspan>
        <tspan fill="#f5f5f7"> d.dept_id = e.dept_id</tspan>
      </text>
      <text y="154">
        <tspan fill="#4ade80" font-weight="700">GROUP BY</tspan>
        <tspan fill="#f5f5f7"> d.dept_name</tspan>
      </text>
      <text y="180">
        <tspan fill="#4ade80" font-weight="700">HAVING</tspan>
        <tspan fill="#f5f5f7"> </tspan>
        <tspan fill="#4ade80" font-weight="700">COUNT</tspan>
        <tspan fill="#f5f5f7">(e.emp_id) &gt;= 5;</tspan>
      </text>

      <!-- Mini Result Table -->
      <g transform="translate(0, 220)">
        <rect width="408" height="135" rx="10" fill="rgba(14, 18, 16, 0.9)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <rect width="408" height="30" rx="10" fill="rgba(34, 197, 94, 0.12)" />
        <rect y="18" width="408" height="12" fill="rgba(34, 197, 94, 0.12)" />
        
        <text x="16" y="21" fill="#22c55e" font-size="11" font-weight="700">DEPT_NAME</text>
        <text x="160" y="21" fill="#22c55e" font-size="11" font-weight="700">TOTAL_STAFF</text>
        <text x="280" y="21" fill="#22c55e" font-size="11" font-weight="700">AVG_COMP</text>
        
        <text x="16" y="56" fill="#f5f5f7" font-size="12">Engineering</text>
        <text x="160" y="56" fill="#4ade80" font-size="12" font-weight="700">42</text>
        <text x="280" y="56" fill="#f5f5f7" font-size="12">$145,200</text>
        
        <line x1="0" y1="72" x2="408" y2="72" stroke="rgba(255, 255, 255, 0.06)" />
        
        <text x="16" y="96" fill="#f5f5f7" font-size="12">Data Platform</text>
        <text x="160" y="96" fill="#4ade80" font-size="12" font-weight="700">18</text>
        <text x="280" y="96" fill="#f5f5f7" font-size="12">$158,400</text>
      </g>
    </g>
  </g>
</svg>
